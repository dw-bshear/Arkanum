services:
  arkanum-keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: arkanum-keycloak
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: arkanum-admin-change-me
      KC_HTTP_PORT: 8080
    ports:
      - "8085:8080"
    volumes:
      - ./keycloak/realm-arkanum.json:/opt/keycloak/data/import/realm-arkanum.json:ro
      - arkanum-keycloak-data:/opt/keycloak/data

volumes:
  arkanum-keycloak-data:
